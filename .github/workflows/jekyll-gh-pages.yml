name: Deploy Vite App to GitHub Pages

on:
  # Esegui quando ci sono push sul branch principale (sostituisci "main" con "master" se necessario)
  push:
    branches: ["main"]

  # Permette di avviare il deploy manualmente
  workflow_dispatch:

# Imposta i permessi per il GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Permette un solo deploy alla volta
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job per il build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installa le dipendenze
        run: npm ci

      - name: Build del progetto
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica gli artefatti
        uses: actions/upload-pages-artifact@v3
        with:
          # In base al tuo package.json, Vite esporta la build nella cartella 'dist'
          path: './dist'

  # Job per il deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
