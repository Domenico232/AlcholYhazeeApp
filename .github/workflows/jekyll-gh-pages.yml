name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Imposta la cartella di lavoro di default per tutti i comandi "run"
    defaults:
      run:
        working-directory: ./SignorYhatzee

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Specifica il percorso del file di lock per la cache
          cache-dependency-path: ./SignorYhatzee/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Build del progetto
        run: npm run build
        env:
          VITE_BACKEND_URL: https://signoryahtzeebe.onrender.com

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica gli artefatti
        uses: actions/upload-pages-artifact@v3
        with:
          # Il percorso della cartella dist rispetto alla root del repo
          path: './SignorYhatzee/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
